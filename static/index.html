<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes Chat Editor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>Hermes <span>Chat Editor</span></h1>
        <div class="row">
          <input id="search" type="search" placeholder="搜索标题 / ID…" />
        </div>
        <div class="row small">
          <label><input type="checkbox" id="show-internal" /> 显示内部会话 (oneshot/tool/kanban)</label>
        </div>
        <div class="row">
          <button id="new-session" class="primary">+ 新建会话</button>
          <button id="refresh">刷新</button>
        </div>
      </header>
      <ul id="session-list"></ul>
      <footer id="side-foot"></footer>
    </aside>

    <main id="main">
      <div id="empty" class="empty">← 选择一个会话开始编辑</div>

      <section id="editor" hidden>
        <div id="session-bar">
          <input id="s-title" placeholder="会话标题" />
          <select id="s-source" title="source（oneshot/tool/kanban 会从会话列表隐藏）">
            <option value="cli">cli</option>
            <option value="oneshot">oneshot</option>
            <option value="tool">tool</option>
            <option value="kanban">kanban</option>
            <option value="telegram">telegram</option>
            <option value="api-server">api-server</option>
          </select>
          <label class="pin"><input type="checkbox" id="s-pinned" /> 置顶</label>
          <label class="pin"><input type="checkbox" id="s-archived" /> 归档</label>
          <button id="save-session" class="primary">保存会话属性</button>
          <span id="s-meta" class="meta"></span>
        </div>

        <div id="messages"></div>

        <div id="composer">
          <select id="c-role">
            <option value="user">user</option>
            <option value="assistant">assistant</option>
            <option value="system">system</option>
            <option value="tool">tool</option>
          </select>
          <textarea id="c-content" rows="2" placeholder="追加一条消息到末尾…（预填 / 伪造历史）"></textarea>
          <button id="c-add" class="primary">追加</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
